name: skip_check
on:
  issue_comment:
    types: [created, edited]
permissions:
  contents: read

jobs:
  comment_bot:
    if: startsWith(github.event.comment.body, '@bazel-io skip_check ')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Probe token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- add existing label via curl ---"
          curl -sS -o /tmp/out.json -w "HTTP=%{http_code}\n" -X POST \
            -H "Authorization: bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/2/labels" \
            -d '{"labels":["skip-compatibility-level-check"]}'
          head -c 400 /tmp/out.json; echo
      - name: Run bot
        uses: bazelbuild/continuous-integration/actions/bcr-pr-reviewer@2f5eb5523e74e297c3a7753bc7732b29f230460c # master
        with:
          token: ${{ github.token }}
          action-type: skip_check
